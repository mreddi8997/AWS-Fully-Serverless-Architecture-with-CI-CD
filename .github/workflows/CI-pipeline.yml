name: Build and Deploy Lambda

on: workflow_dispatch

env:
  AWS_REGION: "us-east-2"
  S3_BUCKET: "artifact-bucket-431445718171-us-east-2-an"
  LAMBDA_FUNCTION_NAME: "serverless_api"

# Required for AWS OIDC role assumption
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'serverless-api/package-lock.json'

      - name: Install dependencies
        working-directory: serverless-api
        run: npm ci --production

      - name: Package Lambda ZIP
        run: |
          cd serverless-api
          zip -r ../lambda.zip . -x "*.git*" "*.github*"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::431445718171:role/Lambda-zip
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      - name: Upload lambda.zip to S3
        run: |
          aws s3 cp lambda.zip s3://${{ env.S3_BUCKET }}/lambda.zip
